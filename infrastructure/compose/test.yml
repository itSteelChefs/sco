services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sco_test
      POSTGRES_USER: sco_test_owner
      POSTGRES_PASSWORD: sco-test-owner-password
    ports:
      - "127.0.0.1:55432:5432"
    labels:
      com.sco.lifecycle: test-only
      com.sco.test-owned: "true"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sco_test_owner -d sco_test"]
      interval: 5s
      timeout: 3s
      retries: 12