name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '10.15.1'

jobs:
  static-and-build:
    name: Static, migration, and application builds
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: corepack enable && corepack prepare "pnpm@${PNPM_VERSION}" --activate
      - run: pnpm install --frozen-lockfile
      - name: Verify immutable migration history
        env:
          MIGRATION_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: pnpm ci:migrations
      - run: pnpm ci:secrets
      - run: pnpm --filter @sco/api exec prisma validate --schema prisma/schema.prisma
      - run: pnpm --filter @sco/api exec tsc --noEmit
      - run: pnpm --recursive typecheck
      - name: Test rate limiting without database fixtures
        run: pnpm --filter @sco/api exec vitest run test/integration/rate-limit.integration.test.ts --no-file-parallelism
      - name: Test PostgreSQL pool limits without database fixtures
        run: pnpm --filter @sco/api exec vitest run test/integration/database-pool.integration.test.ts --no-file-parallelism
      - name: Test performance dataset safety boundaries
        run: node --test apps/api/test/performance/*.test.mjs
      - name: Validate isolated performance harness
        run: pnpm performance:validate
      - run: pnpm --filter @sco/partner-web test
      - run: pnpm --filter @sco/operations-web test
      - run: pnpm --filter @sco/api run build
      - run: pnpm --filter @sco/partner-web run build
      - run: pnpm --filter @sco/operations-web run build
      - name: Reject generated tracked changes
        run: git diff --exit-code

  security-tools:
    name: Workflow, secret, dependency, and configuration security
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Install pinned checksum-verified security tools
        run: |
          scripts/ci/install-security-tools.sh "$RUNNER_TEMP/security-tools"
          echo "$RUNNER_TEMP/security-tools" >> "$GITHUB_PATH"
      - run: actionlint .github/workflows/*.yml
      - name: Scan Git history and current content with redaction
        run: scripts/ci/run-gitleaks.sh
      - name: Scan filesystem dependencies and configuration
        run: trivy fs --cache-dir "$RUNNER_TEMP/trivy-cache" --scanners vuln,misconfig --include-dev-deps --severity HIGH,CRITICAL --no-progress --exit-code 1 .

  security-gate:
    name: Security gate on clean PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_DB: sco_dev
          POSTGRES_USER: sco_dev
          POSTGRES_PASSWORD: ci-admin-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sco_dev -d sco_dev"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://sco_dev:ci-admin-password@127.0.0.1:5432/sco_dev
      RUNTIME_DATABASE_URL: postgresql://sco_runtime:ci-runtime-password@127.0.0.1:5432/sco_dev
      SCO_INTERNAL_DATABASE_URL: postgresql://sco_internal_executor:ci-internal-password@127.0.0.1:5432/sco_dev
      RUNTIME_DATABASE_PASSWORD: ci-runtime-password
      SCO_INTERNAL_DATABASE_PASSWORD: ci-internal-password
      SESSION_SECRET: ci-only-session-secret-not-for-deployment
      SCO_DOCUMENT_STORAGE: local
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: corepack enable && corepack prepare "pnpm@${PNPM_VERSION}" --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm ci:prepare-db
      - run: pnpm --filter @sco/api exec vitest run test/integration/security-gate.integration.test.ts

  postgres-suite:
    name: Full PostgreSQL suite
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_DB: sco_dev
          POSTGRES_USER: sco_dev
          POSTGRES_PASSWORD: ci-admin-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sco_dev -d sco_dev"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://sco_dev:ci-admin-password@127.0.0.1:5432/sco_dev
      RUNTIME_DATABASE_URL: postgresql://sco_runtime:ci-runtime-password@127.0.0.1:5432/sco_dev
      SCO_INTERNAL_DATABASE_URL: postgresql://sco_internal_executor:ci-internal-password@127.0.0.1:5432/sco_dev
      RUNTIME_DATABASE_PASSWORD: ci-runtime-password
      SCO_INTERNAL_DATABASE_PASSWORD: ci-internal-password
      SESSION_SECRET: ci-only-session-secret-not-for-deployment
      SCO_DOCUMENT_STORAGE: local
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: corepack enable && corepack prepare "pnpm@${PNPM_VERSION}" --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm ci:prepare-db
      - run: pnpm --filter @sco/api test

  recovery-drill:
    name: Encrypted backup and isolated recovery drill
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: corepack enable && corepack prepare "pnpm@${PNPM_VERSION}" --activate
      - run: pnpm install --frozen-lockfile
      - name: Install recovery tools from signed repositories
        run: scripts/ci/install-recovery-tools.sh
      - name: Verify recovery units and failure paths
        run: pnpm recovery:test
      - name: Destroy source and restore into fresh infrastructure
        run: pnpm recovery:drill

  containers:
    name: Container build (${{ matrix.image }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            dockerfile: apps/api/Dockerfile
          - image: partner-web
            dockerfile: apps/partner-web/Dockerfile
          - image: operations-web
            dockerfile: apps/operations-web/Dockerfile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install pinned checksum-verified Trivy
        run: |
          scripts/ci/install-security-tools.sh "$RUNNER_TEMP/security-tools" trivy
          echo "$RUNNER_TEMP/security-tools" >> "$GITHUB_PATH"
      - name: Build production image without publishing
        run: docker build --file "${{ matrix.dockerfile }}" --tag "sco-${{ matrix.image }}:${GITHUB_SHA}" .
      - name: Verify non-root runtime
        run: test "$(docker image inspect --format '{{.Config.User}}' "sco-${{ matrix.image }}:${GITHUB_SHA}")" = sco
      - name: Scan production image
        run: trivy image --cache-dir "$RUNNER_TEMP/trivy-cache" --scanners vuln,misconfig --image-config-scanners misconfig --severity HIGH,CRITICAL --no-progress --exit-code 1 "sco-${{ matrix.image }}:${GITHUB_SHA}"