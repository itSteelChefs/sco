name: Odoo 19 image security qualification

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/odoo19-image-security.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify-odoo-image:
    name: SBOM and full vulnerability inventory (linux/amd64)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Verify ephemeral x86_64 runner and fixed target
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(uname -m)" = "x86_64"
          docker info --format '{{.OSType}}/{{.Architecture}}' | grep -Eq '^linux/(amd64|x86_64)$'
          {
            echo 'Target: docker.io/library/odoo@sha256:076562619a5de059388d9f9d90545cb575799c04869610a5b20839893819b41b'
            echo 'Expected platform: linux/amd64'
            echo "Runner architecture: $(uname -m)"
            echo "Runner image platform: $(docker info --format '{{.OSType}}/{{.Architecture}}')"
            echo "Syft version: 1.55.0"
            echo "Trivy version: v0.74.0"
            echo "Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > qualification-metadata.txt
      - name: Generate SPDX SBOM from immutable image digest
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: docker.io/library/odoo@sha256:076562619a5de059388d9f9d90545cb575799c04869610a5b20839893819b41b
          format: spdx-json
          output-file: odoo-19-linux-amd64.spdx.json
          syft-version: v1.55.0
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false
      - name: Scan all OS and library vulnerabilities, including unfixed
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: docker.io/library/odoo@sha256:076562619a5de059388d9f9d90545cb575799c04869610a5b20839893819b41b
          scan-type: image
          scanners: vuln
          vuln-type: os,library
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          list-all-pkgs: true
          format: json
          output: trivy-vulnerabilities.json
          version: 0.74.0
          cache: false
          timeout: 20m
          exit-code: 0
      - name: Upload evidence (public repository artifact; no secrets)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: odoo19-image-qualification-${{ github.run_id }}
          path: |
            qualification-metadata.txt
            odoo-19-linux-amd64.spdx.json
            trivy-vulnerabilities.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 9
