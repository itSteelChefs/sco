name: Release

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full commit SHA from main to release
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  authorize-release:
    name: Verify source and successful CI
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      release_sha: ${{ steps.authorize.outputs.release_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Authorize immutable source revision
        id: authorize
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_SHA: ${{ inputs.commit_sha }}
        run: |
          set -Eeuo pipefail
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'A full lowercase commit SHA is required' >&2; exit 64; }
          git fetch --no-tags origin main
          git cat-file -e "${REQUESTED_SHA}^{commit}"
          git merge-base --is-ancestor "$REQUESTED_SHA" origin/main || { echo 'Release SHA is not on main' >&2; exit 1; }
          successful_run=$(gh run list --workflow ci.yml --commit "$REQUESTED_SHA" --event push --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          [[ -n "$successful_run" ]] || { echo 'No successful CI run exists for this commit' >&2; exit 1; }
          echo "release_sha=$REQUESTED_SHA" >> "$GITHUB_OUTPUT"
          echo "Authorized commit $REQUESTED_SHA from successful CI run $successful_run." >> "$GITHUB_STEP_SUMMARY"

  publish-images:
    name: Publish immutable GHCR images
    needs: authorize-release
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      api_image: ${{ steps.publish.outputs.api_image }}
      partner_image: ${{ steps.publish.outputs.partner_image }}
      operations_image: ${{ steps.publish.outputs.operations_image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.authorize-release.outputs.release_sha }}
      - name: Authenticate to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Build once and publish by commit SHA
        id: publish
        env:
          RELEASE_SHA: ${{ needs.authorize-release.outputs.release_sha }}
          PARTNER_WEB_SENTRY_DSN: ${{ vars.PARTNER_WEB_SENTRY_DSN }}
          OPERATIONS_WEB_SENTRY_DSN: ${{ vars.OPERATIONS_WEB_SENTRY_DSN }}
        run: |
          set -Eeuo pipefail
          namespace=$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          docker buildx inspect --bootstrap >/dev/null
          for image in api partner-web operations-web; do
            if docker buildx imagetools inspect "ghcr.io/$namespace/$image:$RELEASE_SHA" >/dev/null 2>&1; then
              echo "Immutable release tag already exists: $image:$RELEASE_SHA" >&2
              exit 1
            fi
          done
          docker buildx build --file apps/api/Dockerfile --tag "ghcr.io/$namespace/api:$RELEASE_SHA" --label "org.opencontainers.image.revision=$RELEASE_SHA" --provenance=true --sbom=true --push --metadata-file api.json .
          docker buildx build --file apps/partner-web/Dockerfile --build-arg "RELEASE_SHA=$RELEASE_SHA" --build-arg "NEXT_PUBLIC_SENTRY_DSN=$PARTNER_WEB_SENTRY_DSN" --tag "ghcr.io/$namespace/partner-web:$RELEASE_SHA" --label "org.opencontainers.image.revision=$RELEASE_SHA" --provenance=true --sbom=true --push --metadata-file partner.json .
          docker buildx build --file apps/operations-web/Dockerfile --build-arg "RELEASE_SHA=$RELEASE_SHA" --build-arg "NEXT_PUBLIC_SENTRY_DSN=$OPERATIONS_WEB_SENTRY_DSN" --tag "ghcr.io/$namespace/operations-web:$RELEASE_SHA" --label "org.opencontainers.image.revision=$RELEASE_SHA" --provenance=true --sbom=true --push --metadata-file operations.json .
          # shellcheck disable=SC2016
          api_digest=$(jq -er '."containerimage.digest" | select(test("^sha256:[0-9a-f]{64}$"))' api.json)
          # shellcheck disable=SC2016
          partner_digest=$(jq -er '."containerimage.digest" | select(test("^sha256:[0-9a-f]{64}$"))' partner.json)
          # shellcheck disable=SC2016
          operations_digest=$(jq -er '."containerimage.digest" | select(test("^sha256:[0-9a-f]{64}$"))' operations.json)
          {
            echo "api_image=ghcr.io/$namespace/api@$api_digest"
            echo "partner_image=ghcr.io/$namespace/partner-web@$partner_digest"
            echo "operations_image=ghcr.io/$namespace/operations-web@$operations_digest"
          } >> "$GITHUB_OUTPUT"
          # shellcheck disable=SC2016
          printf '### Release %s\n- API: `%s`\n- Partner: `%s`\n- Operations: `%s`\n' "$RELEASE_SHA" "$api_digest" "$partner_digest" "$operations_digest" >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        run: docker logout ghcr.io >/dev/null 2>&1 || true

  deploy-staging:
    name: Deploy exact digests to staging
    needs: [authorize-release, publish-images]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: staging
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.authorize-release.outputs.release_sha }}
      - name: Require enabled staging environment
        env:
          DEPLOY_ENABLED: ${{ vars.DEPLOY_ENABLED }}
        run: test "$DEPLOY_ENABLED" = true
      - name: Migrate, deploy, and verify staging
        env:
          DEPLOY_ENVIRONMENT: staging
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          DEPLOY_NETWORK: ${{ vars.DEPLOY_NETWORK }}
          DEPLOY_BIND_ADDRESS: ${{ vars.DEPLOY_BIND_ADDRESS }}
          API_PORT: ${{ vars.API_PORT }}
          PARTNER_PORT: ${{ vars.PARTNER_PORT }}
          OPERATIONS_PORT: ${{ vars.OPERATIONS_PORT }}
          DEPLOY_RUNTIME_ENV: ${{ secrets.DEPLOY_RUNTIME_ENV }}
          DEPLOY_MIGRATION_ENV: ${{ secrets.DEPLOY_MIGRATION_ENV }}
          DEPLOY_WEB_ENV: ${{ secrets.DEPLOY_WEB_ENV }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        run: bash scripts/deploy/deploy-over-ssh.sh "${{ needs.authorize-release.outputs.release_sha }}" "${{ needs.publish-images.outputs.api_image }}" "${{ needs.publish-images.outputs.partner_image }}" "${{ needs.publish-images.outputs.operations_image }}"
