services:
  postgres:
    image: postgres:17-alpine
    env_file:
      - ../../.env
    environment:
      POSTGRES_DB: sco_dev
      POSTGRES_USER: sco_dev
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - sco_postgres_development:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sco_dev -d sco_dev"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  sco_postgres_development:
